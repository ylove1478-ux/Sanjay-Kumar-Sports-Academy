<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanjay Kumar Sports Academy | Chandigarh</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;color:#17202a;background:#f6f8fa;line-height:1.6}
a{text-decoration:none;color:inherit}.container{width:min(1120px,92%);margin:auto}
header{position:fixed;top:0;width:100%;z-index:20;background:rgba(8,15,22,.96);color:#fff}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:900}.brand img{width:52px;height:52px;border-radius:50%;background:#fff}.brand span{color:#ff5a1f}
nav{display:flex;gap:22px;font-weight:700;font-size:14px}.menu{display:none;font-size:28px}
.hero{min-height:100vh;padding-top:76px;display:flex;align-items:center;color:#fff;background:linear-gradient(105deg,rgba(3,9,15,.94),rgba(5,20,30,.68)),url('academy-logo.jpg') center/cover no-repeat}
.hero-content{max-width:760px}.tag{background:#ff5a1f;padding:7px 14px;border-radius:30px;font-weight:800;font-size:12px;margin-bottom:18px;display:inline-block}
h1{font-size:clamp(40px,7vw,76px);line-height:1.02;margin-bottom:18px}.hero p{font-size:19px;color:#e8edf1;margin-bottom:28px}
.btn{display:inline-block;background:#ff5a1f;color:#fff;padding:13px 23px;border-radius:8px;font-weight:800;margin:5px 8px 5px 0;border:2px solid #ff5a1f}
.btn.alt{background:transparent;border-color:#fff}
.btn.yt{background:#ff0000;border-color:#ff0000}
.btn.insta{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);border:none}
.social-home{display:flex;flex-direction:column;margin-top:25px;max-width:700px}
.social-link{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;font-weight:800}
.social-logo{width:55px;height:55px;display:flex;align-items:center;justify-content:center;background:#1a1a1a;border:1px solid rgba(255,255,255,.15);border-radius:14px}
.social-logo img{width:30px;height:30px}.social-copy strong{font-size:17px}.social-copy small{font-size:13px;color:#cbd3da}
.social-arrow{margin-left:auto;color:#ff6a2a;font-size:24px}
section{padding:82px 0}.section-head{text-align:center;margin:0 auto 42px}.section-head h2{font-size:38px}
.about{background:#101923;color:#fff}.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center}
.logo-large{width:100%;border-radius:20px;background:#fff}.about ul{list-style:none;margin-top:18px}.about li{margin:11px 0}

/* DIRECTOR CARD */
.director-card{display:flex;gap:20px;align-items:center;background:rgba(255,90,31,.1);border-left:4px solid #ff5a1f;padding:20px;border-radius:12px;margin:20px 0}
.director-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #ff5a1f;flex:none}
.director-info h3{color:#ff5a1f;font-size:22px;margin-bottom:5px}
.director-info p{color:#dbe2e7;font-size:15px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#fff;border-radius:16px;padding:25px}.icon{font-size:35px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.gallery img{width:100%;height:220px;object-fit:cover;border-radius:14px}

/* NEW SOCIAL SECTION */
.social-section{background:#fff;text-align:center}
.social-buttons{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.social-big-btn{display:flex;align-items:center;gap:12px;padding:16px 30px;border-radius:12px;font-weight:800;font-size:18px;color:#fff;transition:0.3s}
.social-big-btn:hover{transform:translateY(-3px)}
.social-big-btn img{width:28px;height:28px}

.contact{background:#eef2f5}.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:25px}.contact-box{background:#101923;color:#fff;padding:30px;border-radius:16px}
.contact-social{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.form{background:#fff;padding:28px;border-radius:16px}input
