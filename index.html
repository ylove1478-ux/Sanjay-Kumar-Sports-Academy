.about{background:#101923;color:#fff}.about .section-head p{color:#c1cad1}.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center}
.logo-large{width:100%;max-height:500px;object-fit:contain;border-radius:20px;background:#fff}.about ul{list-style:none;margin-top:18px}.about li{margin:11px 0;color:#dbe2e7}.about li:before{content:"✓";color:#ff6a2a;font-weight:bold;margin-right:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#fff;border-radius:16px;padding:25px;box-shadow:0 10px 30px #17202a12;border:1px solid #e7ebee}.icon{font-size:35px;margin-bottom:10px}.card h3{margin-bottom:7px}.card p{color:#687582}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.gallery img{width:100%;height:220px;object-fit:cover;border-radius:14px}.gallery .logo-shot{object-fit:contain;background:#fff}
.contact{background:#eef2f5}.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:25px}.contact-box{background:#101923;color:#fff;padding:30px;border-radius:16px}.contact-box p{margin:15px 0;color:#d4dce2}.contact-box strong{color:#ff6a2a}
.form{background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 30px #17202a12}input,textarea,select{width:100%;padding:13px;margin-bottom:14px;border:1px solid #d8dfe5;border-radius:8px;font:inherit}textarea{height:120px}
footer{background:#080d13;color:#b8c1c9;text-align:center;padding:28px}.footer-name{color:#fff;font-weight:800}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.about-grid,.contact-grid{grid-template-columns:1fr}}
@media(max-width:700px){nav{display:none;position:absolute;top:76px;left:0;width:100%;background:#0a1018;flex-direction:column;padding:18px 5%;gap:14px}.nav.open nav{display:flex}.menu{display:block}.brand{font-size:13px}.brand img{width:46px;height:46px}.hero{min-height:90vh}.hero p{font-size:16px}section{padding:62px 0}.grid,.about-grid,.contact-grid{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}.gallery img{height:165px}}

.social-home{display:flex;flex-direction:column;gap:0;margin-top:22px;max-width:700px}
.social-link{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.24);color:#fff;font-weight:800}
.social-logo{width:64px;height:64px;display:flex;align-items:center;justify-content:center;flex:none;background:#05080d;border:1px solid rgba(255,255,255,.18);border-radius:14px;overflow:hidden}
.social-logo img{width:56px;height:56px;object-fit:contain;display:block}
.social-copy{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.social-copy strong{font-size:18px}.social-copy small{font-size:12px;color:#cbd3da;margin-top:4px}
.social-arrow{margin-left:auto;color:#ff641f;font-size:30px}
@media(max-width:700px){.social-logo{width:58px;height:58px}.social-logo img{width:50px;height:50px}.social-copy strong{font-size:16px}.social-copy small{font-size:11px}}

</style>
