*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}

.about{background:#101923;color:#fff}.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center}
.logo-large{width:100%;border-radius:20px;background:#fff;padding:10px}

.director-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #ff5a1f}
.director-info h3{color:#ff5a1f;font-size:22px;margin-bottom:5px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#fff;padding:25px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card h3{color:#ff5a1f;margin-bottom:10px}
