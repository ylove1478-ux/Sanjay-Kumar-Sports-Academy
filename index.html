*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;color:#17202a;background:#f6f8fa;line-height:1.6}
a{text-decoration:none;color:inherit}
.container{width:min(1180px,92%);margin:auto}

header{position:fixed;top:0;width:100%;z-index:20;background:rgba(5,10,16,.96);color:#fff;box-shadow:0 2px 18px #0005}
.nav{height:82px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:13px;font-weight:900;letter-spacing:.2px}

.brand span{color:#ff641f;font-size:20px}.brand b{color:#fff}
nav{display:flex;gap:24px;font-weight:700;font-size:14px}
nav a:hover{color:#ff6a2a}.menu{display:none;font-size:30px}

.hero{
 min-height:100vh;padding-top:82px;display:flex;align-items:center;color:#fff;
 background:
 linear-gradient(90deg,rgba(3,8,13,.96) 0%,rgba(3,8,13,.84) 45%,rgba(3,8,13,.46) 100%),
 url('academy-logo.jpg') center/cover no-repeat;

}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 48%,rgba(255,91,22,.12),transparent 34%);pointer-events:none}
.hero-content{max-width:780px;position:relative;z-index:1}
.tag{display:inline-block;background:#ff5a1f;padding:7px 14px;border-radius:30px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:18px}

h1 br+*{}
.hero p{font-size:19px;color:#e8edf1;max-width:650px;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:#ff5a1f;color:#fff;padding:14px 24px;border-radius:10px;font-weight:900;margin:5px 10px 5px 0;border:2px solid #ff5a1f;box-shadow:0 8px 22px #0004}
.btn.alt{background:transparent;border-color:#ff6a2a}
.btn:hover{transform:translateY(-2px)}

.social-home{display:flex;flex-direction:column;gap:0;margin-top:22px;max-width:700px}
.social-link{

 color:#fff;font-weight:800;transition:.2s
}
.social-link:hover{padding-left:6px}
.social-logo{width:72px;height:72px;display:flex;align-items:center;justify-content:center;flex:none;background:#05080d;border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden}
.social-logo img{width:72px;height:72px;object-fit:contain;border-radius:12px;background:transparent}

.social-copy strong{font-size:20px}.social-copy small{font-size:14px;color:#cbd3da;margin-top:4px}
.social-arrow{margin-left:auto;color:#ff641f;font-size:32px;font-weight:300}

section{padding:82px 0}
.section-head{text-align:center;max-width:700px;margin:0 auto 42px}
.section-head h2{font-size:38px;line-height:1.1;margin-bottom:10px}.section-head p{color:#687582}

.about{background:#101923;color:#fff}.about .section-head p{color:#c1cad1}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center}
.logo-large{width:100%;max-height:500px;object-fit:contain;border-radius:20px;background:#fff}
.about ul{list-style:none;margin-top:18px}.about li{margin:11px 0;color:#dbe2e7}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

.icon{font-size:35px;margin-bottom:10px}.card h3{margin-bottom:7px}.card p{color:#687582}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.gallery img{width:100%;height:220px;object-fit:cover;border-radius:14px}.gallery .logo-shot{object-fit:contain;background:#fff}

.contact{background:#eef2f5}.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:25px}
.contact-box{background:#101923;color:#fff;padding:30px;border-radius:16px}
.contact-box p{margin:15px 0;color:#d4dce2}.contact-box strong{color:#ff6a2a}
.form{background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 30px #17202a12}
input,textarea,select{width:100%;padding:13px;margin-bottom:14px;border:1px solid #d8dfe5;border-radius:8px;font:inherit}
textarea{height:120px}
footer{background:#080d13;color:#b8c1c9;text-align:center;padding:28px}.footer-name{color:#fff;font-weight:800}

@media(max-width:850px){

}

 .brand{font-size:12px}.brand span{font-size:15px}.brand img{width:50px;height:50px}

 .social-logo,.social-logo img{width:58px;height:58px}
 .social-copy strong{font-size:17px}.social-copy small{font-size:12px}
}
